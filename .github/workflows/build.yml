name: Hourly upstream Docker build

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'

concurrency:
  group: upstream-docker-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: diegosouzapw/OmniRoute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test release naming and publication
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Resolve current upstream default branch and exact commit
        id: upstream
        run: python3 scripts/resolve-upstream.py

      - name: Checkout exact upstream source (without credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: diegosouzapw/OmniRoute
          ref: ${{ steps.upstream.outputs.sha }}
          path: upstream
          persist-credentials: false

      - name: Hosted runner build headroom
        run: |
          set -euo pipefail
          # Public standard Linux runner, no paid large or self-hosted runner.
          free -h
          df -h /
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 8G /mnt/omniroute.swap
          sudo chmod 600 /mnt/omniroute.swap
          sudo mkswap /mnt/omniroute.swap
          sudo swapon /mnt/omniroute.swap

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build using unmodified upstream Dockerfile and npm build scripts
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: upstream
          file: upstream/Dockerfile
          target: runner-base
          platforms: linux/amd64
          load: true
          tags: ${{ steps.upstream.outputs.image }}:${{ steps.upstream.outputs.version }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=12288
            OMNIROUTE_BUILD_WORKERS=2
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
            org.opencontainers.image.version=${{ steps.upstream.outputs.version }}
            org.opencontainers.image.licenses=MIT
            io.omniroute.upstream.repository=https://github.com/diegosouzapw/OmniRoute
            io.omniroute.upstream.branch=${{ steps.upstream.outputs.branch }}
          cache-from: type=gha,scope=upstream-amd64
          cache-to: type=gha,scope=upstream-amd64,mode=max,ignore-error=true

      - name: Boot smoke check (not upstream release qualification)
        env:
          IMAGE: ${{ steps.upstream.outputs.image }}:${{ steps.upstream.outputs.version }}
        run: bash scripts/smoke.sh "$IMAGE"

      - name: Publish version image and promote latest
        env:
          IMAGE: ${{ steps.upstream.outputs.image }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:latest" "$IMAGE:$VERSION"
          version_digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          latest_digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)
          test "$version_digest" = "$latest_digest"
          echo "IMAGE_DIGEST=$version_digest" >> "$GITHUB_ENV"

      - name: Publish matching GitHub release and build metadata
        env:
          IMAGE: ${{ steps.upstream.outputs.image }}
          VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
          BUILD_TIMESTAMP: ${{ steps.upstream.outputs.build_timestamp }}
        run: python3 scripts/release.py

      - name: Build summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          VERSION: ${{ steps.upstream.outputs.version }}
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          {
            echo "## Hourly upstream image: $RESULT"
            echo "Version: $VERSION"
            echo "Upstream commit: $SHA"
            echo "Digest: ${IMAGE_DIGEST:-not published}"
            echo "No upstream release-green, lint, unit/integration, or scanner gates are imported."
          } >> "$GITHUB_STEP_SUMMARY"
